name: capibloques-dev

# Runtime estable de DEV. El editor interactivo se ejecuta en la PC de trabajo;
# esta VM sirve únicamente un build estático, sin Vinext dev, HMR ni Wrangler.
services:
  editor:
    build:
      context: .
      dockerfile: ops/public-dev/Dockerfile
      args:
        CAPIBLOQUES_BUILD_REVISION: ${CAPIBLOQUES_BUILD_REVISION:-unknown}
    image: capibloques-editor-dev:${CAPIBLOQUES_WEB_IMAGE_TAG:-local}
    pull_policy: never
    user: "101:101"
    init: true
    environment:
      CAPIBLOQUES_EDGE_IP: ${CAPIBLOQUES_EDGE_IP:-127.0.0.1}
      NGINX_ENVSUBST_FILTER: ^CAPIBLOQUES_EDGE_IP$$
    ports:
      # Recuperación: sólo loopback, normalmente mediante túnel SSH.
      - "${CAPIBLOQUES_LOCAL_BIND_IP:-127.0.0.1}:${CAPIBLOQUES_LOCAL_PORT:-3000}:8081"
      # El valor seguro por defecto tampoco sale de loopback. El instalador de
      # fase 13 fija aquí la IP LAN exacta de capi-dev.
      - "${CAPIBLOQUES_PUBLIC_BIND_IP:-127.0.0.1}:${CAPIBLOQUES_PUBLIC_PORT:-3080}:8080"
    networks:
      web_edge: {}
      public_api:
        ipv4_address: ${CAPIBLOQUES_WEB_PROXY_IP:-172.30.13.2}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=8m,uid=101,gid=101,mode=0700
      - /var/cache/nginx:rw,nosuid,nodev,size=8m,uid=101,gid=101,mode=0700
      # El entrypoint oficial materializa aquí la plantilla ya validada.
      - /etc/nginx/conf.d:rw,nosuid,nodev,size=1m,uid=101,gid=101,mode=0750
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    # systemd inicia este contenedor sólo después del firewall; evitar que
    # Docker lo publique por su cuenta durante el arranque.
    restart: "no"
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null --header='Host: localhost' http://127.0.0.1:8081/api/health/ready/"
      interval: 20s
      timeout: 8s
      start_period: 20s
      retries: 3

networks:
  # Tiene salida sólo para que Docker pueda publicar puertos; no contiene API,
  # base, compilador ni otro servicio de la aplicación.
  web_edge: {}
  # Frontera estática editor/API. El instalador valida que las IP pertenezcan a
  # la subred y no colisionen antes de escribir la configuración privada.
  public_api:
    internal: true
    ipam:
      config:
        - subnet: ${CAPIBLOQUES_PROXY_SUBNET:-172.30.13.0/29}
