name: Verificar CapiBloques

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CAPIBLOQUES_SECRETS_DIR: ${{ github.workspace }}/../capibloques-ci-secrets
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar secretos efímeros fuera del checkout
        run: |
          python3 scripts/test_init_dev_secrets.py
          python3 scripts/init_dev_secrets.py "$CAPIBLOQUES_SECRETS_DIR"
      - name: Validar y construir backend
        run: |
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml config --quiet
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml build api
      - name: Inicializar PostgreSQL y migraciones
        run: |
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml up -d --wait db
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml run --rm -T api python manage.py migrate --noinput
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml up -d --wait api
      - name: Probar API, rol limitado y persistencia tras recreación
        run: sh scripts/verify-backend-dev.sh --restart
      - name: Detener servicios de CI sin borrar volúmenes
        if: always()
        run: docker compose -f compose.dev.yaml -f compose.backend.dev.yaml down
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar configuración del entorno de desarrollo
        run: docker compose -f compose.dev.yaml config --quiet

      - name: Instalar Chromium para pruebas reales
        run: npx playwright install --with-deps chromium

      - name: Verificar tipos, estilo y comportamiento
        run: |
          npm run typecheck
          npm run lint
          npm run lint:displays
          npm run test:smoke
          npm run test:display-driver
          npm audit --audit-level=high

      - name: Probar la interfaz en Chromium
        run: npm run test:e2e

      - name: Construir sitio estático
        run: npm run build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci

      - name: Preparar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar soporte ESP32 3.3.11
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compilar el código generado para Wemos D1 R32
        run: |
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/capibloques-ci/capibloques-ci.ino
          arduino-cli compile --fqbn esp32:esp32:d1_uno32 .arduino-ci/capibloques-ci
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/auxiliary/auxiliary.ino auxiliary
          arduino-cli compile --fqbn esp32:esp32:d1_uno32 .arduino-ci/auxiliary

      - name: Compilar los cinco perfiles de pantalla
        run: |
          arduino-cli lib install "LiquidCrystal_PCF8574@2.3.0" "U8g2@2.36.19" "GFX Library for Arduino@1.6.7"
          node --experimental-strip-types scripts/generate-display-fixtures.mjs
          for profile in lcd1602 lcd2004 ssd1306 ili9341 ili9488; do
            arduino-cli compile --fqbn esp32:esp32:d1_uno32 ".arduino-ci/$profile"
          done
