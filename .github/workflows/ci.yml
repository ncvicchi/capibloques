name: Verificar CapiBloques

on:
  push:
    branches: [main]
    tags: ["ci-full-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      verify: ${{ steps.paths.outputs.verify }}
      firmware: ${{ steps.paths.outputs.firmware }}
      esp_idf: ${{ steps.paths.outputs.esp_idf }}
      ops: ${{ steps.paths.outputs.ops }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clasificar archivos modificados
        id: paths
        shell: bash
        run: |
          if [[ '${{ github.ref }}' == refs/tags/ci-full-* ]]; then
            printf 'backend=true\nverify=true\nfirmware=true\nesp_idf=true\nops=true\n' | tee -a "$GITHUB_OUTPUT"
            echo 'Validación completa solicitada expresamente.'
            exit 0
          fi
          if [[ '${{ github.event_name }}' == pull_request ]]; then
            git diff --name-only 'origin/${{ github.base_ref }}...HEAD' > /tmp/changed-files
          elif [[ '${{ github.event_name }}' == workflow_dispatch ]]; then
            git diff-tree --no-commit-id --name-only -r HEAD > /tmp/changed-files
          elif [[ '${{ github.event.before }}' =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id --name-only -r HEAD > /tmp/changed-files
          else
            git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' > /tmp/changed-files
          fi
          backend=false; verify=false; firmware=false; esp_idf=false; ops=false
          while IFS= read -r file; do
            known=false
            case "$file" in
              docs/*|README.md|AGENTS.md) known=true ;;
              .github/workflows/*|scripts/update-dev.sh|scripts/deploy-dev.ps1|scripts/deploy-dev-remote.sh)
                ops=true; known=true ;;
              backend/*|compose.backend.dev.yaml|backend-requirements.txt|scripts/verify-backend-dev.sh|scripts/init_dev_secrets.py|scripts/test_init_dev_secrets.py)
                backend=true; known=true ;;
              app/*|components/*|lib/*|tests/*|public/*|styles/*|package.json|package-lock.json|tsconfig.json|vite.config.ts|next.config.ts|playwright.config.ts|compose.dev.yaml|ops/public-dev/*)
                verify=true; known=true ;;
              scripts/*.mjs|scripts/*.py)
                verify=true; known=true ;;
              compose.compiler.dev.yaml|ops/compiler/*)
                backend=true; verify=true; known=true ;;
            esac
            case "$file" in
              lib/capiblocks.ts|lib/scene-model.ts|lib/board-profiles.ts|lib/display-model.ts|lib/led-matrix.ts|scripts/firmware-fixtures.mjs|scripts/generate-arduino-fixture.mjs|scripts/generate-display-fixtures.mjs)
                firmware=true; known=true ;;
            esac
            case "$file" in
              lib/capiblocks.ts|lib/scene-model.ts|lib/board-profiles.ts|lib/display-model.ts|lib/led-matrix.ts|lib/idf-runtime.ts|lib/firmware-archive.ts|scripts/firmware-fixtures.mjs|scripts/generate-idf-fixtures.mjs|scripts/verify-idf-archives.py)
                esp_idf=true; known=true ;;
              interpreter/*|scripts/build-interpreter-firmware.sh|scripts/package-interpreter-firmware.py)
                esp_idf=true; verify=true; known=true ;;
            esac
            case "$file" in
              lib/capiblocks.ts|lib/scene-model.ts)
                backend=true; known=true ;;
            esac
            if [[ $known == false ]]; then
              backend=true; verify=true; firmware=true; esp_idf=true
            fi
          done < /tmp/changed-files
          printf 'backend=%s\nverify=%s\nfirmware=%s\nesp_idf=%s\nops=%s\n' "$backend" "$verify" "$firmware" "$esp_idf" "$ops" | tee -a "$GITHUB_OUTPUT"
          echo 'Archivos:'; sed 's/^/  - /' /tmp/changed-files

  esp-idf:
    needs: scope
    if: needs.scope.outputs.esp_idf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    defaults:
      run:
        shell: bash
    env:
      IDF_CCACHE_ENABLE: "1"
      IDF_PY_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar proyectos nativos y ZIP
        run: node --experimental-strip-types scripts/generate-idf-fixtures.mjs
      - name: Compilar doce proyectos ESP-IDF nativos
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          python scripts/verify-idf-archives.py
          mkdir -p .idf-ci/build-project
          for profile in main auxiliary matrix smart-lights lcd1602keypad lcd1602 lcd2004 ssd1306 ili9341 ili9488; do
            # Same IDF/configuration: reuse framework objects, not the generated app.
            # Do NOT preserve timestamps: each extracted main.cpp must rebuild.
            cp -R ".idf-ci/from-zip/$profile/capibloques/." .idf-ci/build-project/
            cmp ".idf-ci/from-zip/$profile/capibloques/main/main.cpp" .idf-ci/build-project/main/main.cpp
            idf.py -C .idf-ci/build-project -DIDF_TARGET=esp32 build
            sha256sum .idf-ci/build-project/main/main.cpp .idf-ci/build-project/build/capibloques.bin
          done
          rm -rf .idf-ci/build-s3
          cp -R .idf-ci/from-zip/s3/capibloques .idf-ci/build-s3
          idf.py -C .idf-ci/build-s3 -DIDF_TARGET=esp32s3 build
          sha256sum .idf-ci/build-s3/main/main.cpp .idf-ci/build-s3/build/capibloques.bin
          rm -rf .idf-ci/build-waveshare
          cp -R .idf-ci/from-zip/waveshare5/capibloques .idf-ci/build-waveshare
          idf.py -C .idf-ci/build-waveshare -DIDF_TARGET=esp32s3 build
          sha256sum .idf-ci/build-waveshare/main/main.cpp .idf-ci/build-waveshare/build/capibloques.bin
      - name: Compilar y empaquetar el intérprete genérico
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          rm -rf outputs/interpreter-wemos outputs/interpreter-s3 outputs/interpreter-waveshare outputs/interpreter-release
          idf.py -C interpreter -B outputs/interpreter-wemos -DIDF_TARGET=esp32 -DSDKCONFIG="$PWD/outputs/interpreter-wemos/sdkconfig" -DCAPI_BOARD_ID=wemos-d1-r32 build
          python scripts/package-interpreter-firmware.py --profile wemos-d1-r32 --build outputs/interpreter-wemos --output outputs/interpreter-release --revision "$GITHUB_SHA"
          idf.py -C interpreter -B outputs/interpreter-s3 -DIDF_TARGET=esp32s3 -DSDKCONFIG="$PWD/outputs/interpreter-s3/sdkconfig" -DCAPI_BOARD_ID=diymall-esp32-s3-devkitc-v1-n16r8 build
          python scripts/package-interpreter-firmware.py --profile diymall-esp32-s3-devkitc-v1-n16r8 --build outputs/interpreter-s3 --output outputs/interpreter-release --revision "$GITHUB_SHA"
          idf.py -C interpreter -B outputs/interpreter-waveshare -DIDF_TARGET=esp32s3 -DSDKCONFIG="$PWD/outputs/interpreter-waveshare/sdkconfig" -DCAPI_BOARD_ID=waveshare-esp32-s3-touch-lcd-5-28117 build
          python scripts/package-interpreter-firmware.py --profile waveshare-esp32-s3-touch-lcd-5-28117 --build outputs/interpreter-waveshare --output outputs/interpreter-release --revision "$GITHUB_SHA"
      - name: Conservar firmware genérico verificable
        uses: actions/upload-artifact@v4
        with:
          name: capibloques-interpreter-1.5.0
          path: outputs/interpreter-release/
          retention-days: 14
  backend:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      CAPIBLOQUES_SECRETS_DIR: ${{ github.workspace }}/../capibloques-ci-secrets
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar secretos efímeros fuera del checkout
        run: |
          python3 scripts/test_init_dev_secrets.py
          python3 scripts/init_dev_secrets.py "$CAPIBLOQUES_SECRETS_DIR"
      - name: Validar y construir backend
        run: |
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml config --quiet
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml build api
      - name: Inicializar PostgreSQL y migraciones
        run: |
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml up -d --wait db
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml run --rm -T api python manage.py migrate --noinput
          docker compose -f compose.dev.yaml -f compose.backend.dev.yaml up -d --wait api
      - name: Probar API, rol limitado y persistencia tras recreación
        run: sh scripts/verify-backend-dev.sh --restart
      - name: Detener servicios de CI sin borrar volúmenes
        if: always()
        run: docker compose -f compose.dev.yaml -f compose.backend.dev.yaml down
  verify:
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        if: needs.scope.outputs.verify == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: needs.scope.outputs.verify == 'true'
        run: npm ci

      - name: Validar scripts operativos
        run: |
          bash -n scripts/deploy-dev-remote.sh
          bash -n scripts/update-dev.sh
          pwsh -NoProfile -Command '[scriptblock]::Create((Get-Content scripts/deploy-dev.ps1 -Raw)) | Out-Null'

      - name: Validar configuración del entorno de desarrollo
        if: needs.scope.outputs.verify == 'true'
        run: docker compose -f compose.dev.yaml config --quiet

      - name: Instalar Chromium para pruebas reales
        if: needs.scope.outputs.verify == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verificar tipos, estilo y comportamiento
        if: needs.scope.outputs.verify == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm run lint:displays
          npm run test:smoke
          npm run test:display-driver
          npm run test:idf
          npm run test:idf-driver
          npm run test:usb
          node --experimental-strip-types scripts/compiler-generator.test.mjs
          python scripts/compiler-isolation.test.py
          python scripts/test_package_interpreter.py
          npx oxlint components/firmware-builds.tsx components/compiler-management.tsx components/usb-board.tsx
          npm audit --audit-level=high

      - name: Verificar primero las regresiones de texto ampliado
        if: needs.scope.outputs.verify == 'true'
        run: npx playwright test tests/programming-experience.spec.ts tests/session-exit.spec.ts --grep 'vacío y móvil|confirmación y cancelar alcanzables' --retries=0

      - name: Probar la interfaz en Chromium
        if: needs.scope.outputs.verify == 'true'
        run: npm run test:e2e

      - name: Construir sitio estático
        if: needs.scope.outputs.verify == 'true'
        run: npm run build

      - name: Validar y construir el runtime público de desarrollo
        if: needs.scope.outputs.verify == 'true'
        run: |
          python ops/public-dev/test_contracts.py
          docker compose -f compose.dev.yaml build editor

      - name: Conservar diagnóstico UI sintético si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-diagnostics
          path: test-results/
          retention-days: 3

  firmware:
    needs: scope
    if: needs.scope.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci

      - name: Preparar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar soporte ESP32 3.3.11
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compilar el código generado para Wemos D1 R32
        run: |
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/capibloques-ci/capibloques-ci.ino
          arduino-cli compile --fqbn esp32:esp32:d1_uno32 .arduino-ci/capibloques-ci
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/auxiliary/auxiliary.ino auxiliary
          arduino-cli compile --fqbn esp32:esp32:d1_uno32 .arduino-ci/auxiliary
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/matrix/matrix.ino matrix
          arduino-cli compile --fqbn esp32:esp32:d1_uno32 .arduino-ci/matrix
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/otto/otto.ino otto
          arduino-cli compile --fqbn esp32:esp32:d1_uno32 .arduino-ci/otto
          arduino-cli lib install "Adafruit NeoPixel@1.12.3"
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/smart-lights/smart-lights.ino smart-lights
          arduino-cli compile --fqbn esp32:esp32:d1_uno32 .arduino-ci/smart-lights

      - name: Compilar el código generado para DIYmall ESP32-S3 N16R8
        run: |
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/s3/s3.ino s3
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,USBMode=hwcdc' .arduino-ci/s3

      - name: Compilar los siete perfiles de pantalla
        run: |
          arduino-cli lib install "LiquidCrystal@1.0.7" "LiquidCrystal_PCF8574@2.3.0" "U8g2@2.36.19" "GFX Library for Arduino@1.6.7" "Adafruit NeoPixel@1.12.3"
          node --experimental-strip-types scripts/generate-display-fixtures.mjs
          for profile in lcd1602keypad lcd1602 lcd2004 ssd1306 ili9341 ili9488; do
            arduino-cli compile --fqbn esp32:esp32:d1_uno32 ".arduino-ci/$profile"
          done
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,USBMode=hwcdc' .arduino-ci/waveshare5
