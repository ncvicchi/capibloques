name: Publicar CapiBloques en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para pruebas reales
        run: npx playwright install --with-deps chromium

      - name: Verificar tipos, estilo y comportamiento
        run: |
          npm run typecheck
          npm run lint
          npm run test:smoke
          npm audit --audit-level=high

      - name: Probar la interfaz en Chromium
        run: npm run test:e2e

      - name: Preparar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar soporte ESP32 3.3.11
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compilar el código generado para Wemos D1 R32
        run: |
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/capibloques-ci/capibloques-ci.ino
          arduino-cli compile --fqbn esp32:esp32:d1_uno32 .arduino-ci/capibloques-ci
          node --experimental-strip-types scripts/generate-arduino-fixture.mjs .arduino-ci/auxiliary/auxiliary.ino auxiliary
          arduino-cli compile --fqbn esp32:esp32:d1_uno32 .arduino-ci/auxiliary

      - name: Construir sitio estático
        run: npm run build

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
